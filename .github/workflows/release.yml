name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build Release (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            args: '--bundles msi'
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          - name: Linux
            platform: ubuntu-22.04
            args: '--bundles appimage,deb'
          - name: Linux ARM64 (Raspberry Pi)
            # ARM64 hosted runners are free only in public repositories.
            # Build on 22.04-arm (glibc 2.35) so the bundles run on
            # Raspberry Pi OS Bookworm (glibc 2.36) and newer.
            platform: ubuntu-22.04-arm
            args: '--bundles appimage,deb'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libwebkit2gtk-4.1-dev \
            build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev unzip \
            libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust Target
        if: matrix.platform == 'macos-latest'
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> src-tauri/target'

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Verify macOS Build Environment
        if: matrix.platform == 'macos-latest'
        run: |
          hdiutil info
          df -h .
          sw_vers

      - name: Enable Updater Artifacts for Release
        run: |
          bun -e 'const fs = require("fs"); const file = "src-tauri/tauri.conf.json"; const config = JSON.parse(fs.readFileSync(file, "utf8")); config.bundle.createUpdaterArtifacts = true; fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");'

      - name: Load Versioned Release Notes
        id: release-notes
        shell: bash
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          notes="docs/RELEASE_NOTES_V${version}.md"
          test -f "$notes"
          {
            echo 'body<<TYPSASTRA_RELEASE_NOTES'
            cat "$notes"
            echo 'TYPSASTRA_RELEASE_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Typsastra v__VERSION__'
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # tauri-action appends `build`; with no override it auto-detects Bun.
          args: ${{ matrix.args }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true

      - name: Verify macOS DMG
        if: matrix.platform == 'macos-latest'
        run: |
          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg=$(find "${dmg_dir}" -name '*.dmg' -print -quit 2>/dev/null || true)
          if [ -z "${dmg}" ]; then
            echo "No DMG found in ${dmg_dir}"
            ls -la "${dmg_dir}/" || true
            exit 1
          fi
          echo "Verifying DMG: ${dmg}"
          hdiutil verify -verbose "${dmg}"
          echo "Mounting DMG for structure check..."
          dev_info=$(hdiutil attach -nobrowse -readonly "${dmg}" 2>&1)
          echo "${dev_info}"
          mount_point=$(echo "${dev_info}" | grep '/Volumes/' | awk '{print $NF}')
          echo "Mounted at: ${mount_point}"
          ls -laR "${mount_point}/"
          app_path="${mount_point}/Typsastra.app"
          if [ -d "${app_path}" ]; then
            echo "App bundle found"
            ls -la "${app_path}/Contents/MacOS/"
          else
            echo "ERROR: Typsastra.app not found in DMG"
            hdiutil detach "${mount_point}"
            exit 1
          fi
          hdiutil detach "${mount_point}"
          echo "DMG verification complete"
