name: Enhanced Unicode Engine Release

on:
  push:
    tags:
      - "enhanced-unicode-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ENGINE_VERSION: "0.4.1"
  ENGINE_TAG: "enhanced-unicode-v0.4.1"
  ENGINE_REPOSITORY: "Sovichea/typst"
  ENGINE_COMMIT: "e3a60d5aa897d718b465efc3de0031c7d74efb3b"
  KRILLA_REPOSITORY: "Sovichea/krilla"
  KRILLA_COMMIT: "bb0873416484587814b9ecb682e262056f8effe2"
  EXPECTED_TYPST_VERSION: "0.15.1"

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: typst.exe
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: typst
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: typst
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: typst
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: typst

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Typsastra release definition
        uses: actions/checkout@v4

      - name: Verify release identity
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" != "${ENGINE_TAG}" ]]; then
            echo "This workflow revision releases only ${ENGINE_TAG}; received ${GITHUB_REF_NAME}."
            exit 1
          fi

      - name: Checkout pinned Enhanced Typst source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPOSITORY }}
          ref: ${{ env.ENGINE_COMMIT }}
          path: enhanced-typst

      - name: Setup Rust 1.92
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Enhanced Typst build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "enhanced-typst -> enhanced-typst/target"
          key: enhanced-unicode-${{ env.ENGINE_VERSION }}-${{ matrix.target }}

      - name: Verify pinned source revision
        shell: bash
        working-directory: enhanced-typst
        run: test "$(git rev-parse HEAD)" = "${ENGINE_COMMIT}"

      - name: Build Enhanced Typst CLI
        shell: bash
        working-directory: enhanced-typst
        run: cargo build --release --locked --package typst-cli --target "${{ matrix.target }}"

      - name: Validate executable and compile regression fixtures
        shell: bash
        run: |
          executable="enhanced-typst/target/${{ matrix.target }}/release/${{ matrix.executable }}"
          version="$(${executable} --version)"
          echo "${version}"
          [[ "${version}" == typst\ ${EXPECTED_TYPST_VERSION}* ]]
          "${executable}" compile \
            tests/fixtures/enhanced-unicode/unicode-selection.typ \
            enhanced-unicode-smoke-test.pdf
          test -s enhanced-unicode-smoke-test.pdf
          "${executable}" compile \
            tests/fixtures/enhanced-unicode/wide-repeated-fill.typ \
            enhanced-unicode-wide-fill-smoke-test.pdf
          test -s enhanced-unicode-wide-fill-smoke-test.pdf

      - name: Exercise every supported PDF standard
        shell: bash
        run: |
          executable="enhanced-typst/target/${{ matrix.target }}/release/${{ matrix.executable }}"
          python scripts/validate-enhanced-unicode-pdf-standards.py \
            --typst "${executable}" \
            --output-dir "pdf-standard-smoke-${{ matrix.target }}"

      - name: Package engine with source metadata
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_EXECUTABLE: ${{ matrix.executable }}
        run: |
          archive="typsastra-enhanced-unicode-v${ENGINE_VERSION}-${RELEASE_TARGET}.zip"
          package="package"
          mkdir -p "${package}"
          cp "enhanced-typst/target/${RELEASE_TARGET}/release/${RELEASE_EXECUTABLE}" "${package}/${RELEASE_EXECUTABLE}"
          cp enhanced-typst/LICENSE "${package}/LICENSE"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "schemaVersion": 1,
              "name": "Typsastra Enhanced Unicode Engine",
              "version": os.environ["ENGINE_VERSION"],
              "target": os.environ["RELEASE_TARGET"],
              "executable": os.environ["RELEASE_EXECUTABLE"],
              "typstVersion": os.environ["EXPECTED_TYPST_VERSION"],
              "typstRepository": os.environ["ENGINE_REPOSITORY"],
              "typstCommit": os.environ["ENGINE_COMMIT"],
              "krillaRepository": os.environ["KRILLA_REPOSITORY"],
              "krillaCommit": os.environ["KRILLA_COMMIT"],
              "license": "Apache-2.0",
          }
          Path("package/ENGINE_RELEASE.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo

          archive = Path(f"typsastra-enhanced-unicode-v{os.environ['ENGINE_VERSION']}-{os.environ['RELEASE_TARGET']}.zip")
          with ZipFile(archive, "w", ZIP_DEFLATED, compresslevel=9) as output:
              for path in sorted(Path("package").iterdir()):
                  info = ZipInfo(path.name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.create_system = 3
                  mode = 0o755 if path.name == os.environ["RELEASE_EXECUTABLE"] else 0o644
                  info.external_attr = mode << 16
                  info.compress_type = ZIP_DEFLATED
                  output.writestr(info, path.read_bytes(), compress_type=ZIP_DEFLATED, compresslevel=9)
          PY

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-unicode-${{ matrix.target }}
          path: typsastra-enhanced-unicode-v${{ env.ENGINE_VERSION }}-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 14

  pdf-conformance:
    name: Validate PDF/A and PDF/UA conformance
    needs: build
    runs-on: ubuntu-22.04
    env:
      VERAPDF_VERSION: "1.30.2"
      VERAPDF_INSTALLER_SHA256: "6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838"
    steps:
      - name: Checkout Typsastra release definition
        uses: actions/checkout@v4

      - name: Download Linux Enhanced Unicode Engine
        uses: actions/download-artifact@v4
        with:
          name: enhanced-unicode-x86_64-unknown-linux-gnu
          path: engine-package

      - name: Extract Enhanced Unicode Engine
        shell: bash
        run: |
          unzip -q engine-package/*.zip -d engine
          chmod +x engine/typst
          engine/typst --version

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned veraPDF validator
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/verapdf-installer.zip"
          installer_root="${RUNNER_TEMP}/verapdf-installer"
          install_root="${RUNNER_TEMP}/verapdf"
          curl --fail --location --retry 3 \
            "https://software.verapdf.org/releases/1.30/verapdf-greenfield-${VERAPDF_VERSION}-installer.zip" \
            --output "${archive}"
          echo "${VERAPDF_INSTALLER_SHA256}  ${archive}" | sha256sum --check --strict
          unzip -q "${archive}" -d "${installer_root}"
          sed "s|__VERAPDF_INSTALL_PATH__|${install_root}|g" \
            .github/verapdf-auto-install.xml > "${RUNNER_TEMP}/verapdf-auto-install.xml"
          java -jar \
            "${installer_root}/verapdf-greenfield-${VERAPDF_VERSION}/verapdf-izpack-installer-${VERAPDF_VERSION}.jar" \
            "${RUNNER_TEMP}/verapdf-auto-install.xml"
          "${install_root}/verapdf" --version

      - name: Validate all PDF/A and PDF/UA profiles
        shell: bash
        run: |
          python scripts/validate-enhanced-unicode-pdf-standards.py \
            --typst engine/typst \
            --output-dir pdf-conformance \
            --verapdf "${RUNNER_TEMP}/verapdf/verapdf"

      - name: Upload conformance corpus
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-unicode-pdf-conformance-v${{ env.ENGINE_VERSION }}
          path: pdf-conformance/*.pdf
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish engine release
    needs: [build, pdf-conformance]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Typsastra release definition
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: enhanced-unicode-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksummed release manifest
        run: >-
          bun scripts/enhanced-unicode-release-manifest.ts
          toolchains/enhanced-unicode/release-v0.4.1.json
          release-assets
          release-assets/enhanced-unicode-manifest.json

      - name: Publish engine release in Typsastra repository
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.ENGINE_TAG }}
          name: Typsastra Enhanced Unicode Engine v${{ env.ENGINE_VERSION }}
          body_path: docs/ENHANCED_UNICODE_ENGINE_RELEASE_NOTES_V0.4.1.md
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/enhanced-unicode-manifest.json
