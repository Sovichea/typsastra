site_name: Typsastra
site_description: User guides, feature references, and contributor documentation for Typsastra.
site_url: https://docs.typsastra.com/
repo_url: https://github.com/Sovichea/typsastra
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true
exclude_docs: |
  /README.md
  /DEPLOYMENT.md

theme:
  name: material
  logo: demo-project/assets/typsastra-icon.png
  favicon: demo-project/assets/typsastra-icon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

extra_css:
  - assets/brand.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Tutorials:
      - Start here:
          - Getting started: tutorials/GETTING_STARTED.md
          - Feature demo project: demo-project/README.md
      - Projects and files:
          - Projects and main files: tutorials/PROJECTS_AND_MAIN_FILES.md
          - Explorer and project files: tutorials/EXPLORER_AND_PROJECTS.md
          - Create from templates: tutorials/PROJECT_TEMPLATES.md
          - Project import and export: tutorials/PROJECT_IMPORT_AND_EXPORT.md
      - Writing and editing:
          - Editor and PDF preview: tutorials/EDITOR_AND_PREVIEW.md
          - Editor productivity: tutorials/EDITOR_PRODUCTIVITY.md
          - Document typography: tutorials/DOCUMENT_TYPOGRAPHY.md
          - Markdown live preview: tutorials/MARKDOWN_PREVIEW.md
      - Preview and PDFs:
          - PDF preview and synchronization: tutorials/PDF_PREVIEW_AND_SYNC.md
          - Standalone files and PDFs: tutorials/STANDALONE_FILES_AND_PDFS.md
          - Draft Preview: tutorials/DRAFT_PREVIEW.md
      - Visual tools:
          - Image Tools: tutorials/IMAGE_TOOLS.md
          - Table Tools: tutorials/TABLE_TOOLS.md
      - Language support:
          - Multilingual spellcheck: tutorials/MULTILINGUAL_SPELLCHECK.md
          - Keyboard language completion: tutorials/KEYBOARD_LANGUAGE_COMPLETION.md
          - Language provider installation: tutorials/LANGUAGE_PROVIDER_INSTALLATION.md
      - Advanced workflows:
          - Long-document workflow: tutorials/LONG_DOCUMENT_WORKFLOW.md
          - Low-Memory Mode: tutorials/LOW_MEMORY_MODE.md
          - Toolchain and storage: tutorials/TOOLCHAIN_AND_STORAGE.md
          - Troubleshooting: tutorials/TROUBLESHOOTING.md
  - User reference:
      - Feature guide: FEATURES.md
      - Settings: SETTINGS.md
      - Language tools: LANGUAGE_TOOLS.md
      - Document-script tools: SCOPE_AWARE_LANGUAGE_TOOLS.md
      - Research-document workflows: RESEARCH_DOCUMENT_WORKFLOWS.md
      - Project format: TYPSASTRA_PROJECT_FORMAT.md
      - Preview interception: PREVIEW_INTERCEPTION.md
      - Troubleshooting: TROUBLESHOOTING.md
  - Contributors:
      - Development: DEVELOPMENT.md
      - Language contributor guide: LANGUAGE_CONTRIBUTOR_GUIDE.md
      - Script editing policies: SCRIPT_EDITING_POLICIES.md
      - Compatibility policy: COMPATIBILITY_POLICY.md
      - Performance gates: PERFORMANCE_GATES.md
      - Benchmarks: BENCHMARKS.md
      - WebView storage policy: WEBVIEW_STORAGE_POLICY.md
